<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .brain-path { animation: brainFloat 3s ease-in-out infinite; transform-origin: center; }
    .node-pulse { animation: nodeGlow 2s ease-in-out infinite alternate; transform-origin: center; }
    @keyframes brainFloat {
      0%, 100% { transform: scale(0.97); }
      50% { transform: scale(1.03); }
    }
    @keyframes nodeGlow {
      0% { opacity: 0.4; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.25); }
    }
  </style>
  <rect class="brain-path" x="4" y="4" width="16" height="16" rx="3" stroke="#4E70F6" />
  <rect class="brain-path" x="9" y="9" width="6" height="6" rx="1" stroke="#4E70F6" fill="rgba(78, 112, 246, 0.15)" />
  <line x1="9" y1="1" x2="9" y2="4" stroke="#4E70F6" />
  <line x1="15" y1="1" x2="15" y2="4" stroke="#4E70F6" />
  <line x1="9" y1="20" x2="9" y2="23" stroke="#4E70F6" />
  <line x1="15" y1="20" x2="15" y2="23" stroke="#4E70F6" />
  <line x1="1" y1="9" x2="4" y2="9" stroke="#4E70F6" />
  <line x1="1" y1="15" x2="4" y2="15" stroke="#4E70F6" />
  <line x1="20" y1="9" x2="23" y2="9" stroke="#4E70F6" />
  <line x1="20" y1="15" x2="23" y2="15" stroke="#4E70F6" />
  <circle class="node-pulse" cx="12" cy="12" r="1.5" fill="#4E70F6" stroke="none" />
</svg>

