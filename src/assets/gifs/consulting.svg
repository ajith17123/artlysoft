<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .chat-bubble { animation: chatFloat 2.6s ease-in-out infinite; transform-origin: center; }
    .dot-1 { animation: dotPulse 1.4s ease-in-out infinite 0s; transform-origin: center; }
    .dot-2 { animation: dotPulse 1.4s ease-in-out infinite 0.2s; transform-origin: center; }
    .dot-3 { animation: dotPulse 1.4s ease-in-out infinite 0.4s; transform-origin: center; }
    @keyframes chatFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }
    @keyframes dotPulse {
      0%, 100% { opacity: 0.35; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.25); }
    }
  </style>
  <path class="chat-bubble" d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="#4E70F6" />
  <circle class="dot-1" cx="8" cy="10" r="1" fill="#4E70F6" stroke="none" />
  <circle class="dot-2" cx="12" cy="10" r="1" fill="#4E70F6" stroke="none" />
  <circle class="dot-3" cx="16" cy="10" r="1" fill="#4E70F6" stroke="none" />
</svg>

