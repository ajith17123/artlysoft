<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .badge-ring { animation: badgePulse 2.5s ease-in-out infinite; transform-origin: 12px 9px; }
    .ribbon-tail { animation: ribbonSway 2.5s ease-in-out infinite alternate; transform-origin: 12px 9px; }
    @keyframes badgePulse {
      0%, 100% { transform: scale(0.96); }
      50% { transform: scale(1.04); }
    }
    @keyframes ribbonSway {
      0% { transform: rotate(-3deg); }
      100% { transform: rotate(3deg); }
    }
  </style>
  <circle class="badge-ring" cx="12" cy="9" r="6" stroke="#4E70F6" fill="rgba(78, 112, 246, 0.12)" />
  <path class="ribbon-tail" d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11" stroke="#4E70F6" />
  <polyline class="badge-ring" points="9.5 9 11 10.5 14.5 7" stroke="#4E70F6" stroke-width="2" />
</svg>

