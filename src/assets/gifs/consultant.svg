<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .case-body { animation: caseFloat 3s infinite ease-in-out; }
    .chart-line { animation: lineGrow 2s infinite ease-in-out; }
    @keyframes caseFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }
    @keyframes lineGrow {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
  </style>
  <!-- Briefcase Main Box -->
  <rect class="case-body" x="2" y="7" width="20" height="14" rx="2" stroke="#C57D56" stroke-width="2" />
  <!-- Handle -->
  <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2" stroke="#0A192F" stroke-width="2" />
  <!-- Center Latch / Strategy Bar -->
  <line x1="12" y1="11" x2="12" y2="13" stroke="#C57D56" stroke-width="2" />
  <!-- Growth Arrow inside -->
  <polyline class="chart-line" points="6 16 10 12 14 14 18 10" stroke="#0A192F" stroke-width="2" />
</svg>
