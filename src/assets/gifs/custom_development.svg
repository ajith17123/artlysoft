<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .bracket-left { animation: codeShiftLeft 2.2s ease-in-out infinite alternate; transform-origin: center; }
    .bracket-right { animation: codeShiftRight 2.2s ease-in-out infinite alternate; transform-origin: center; }
    @keyframes codeShiftLeft {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(-1.5px); }
    }
    @keyframes codeShiftRight {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(1.5px); }
    }
  </style>
  <polyline class="bracket-left" points="8 6 2 12 8 18" stroke="#4E70F6" />
  <polyline class="bracket-right" points="16 6 22 12 16 18" stroke="#4E70F6" />
</svg>

