<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .layer-top { animation: layerFloat 2.2s ease-in-out infinite; }
    .layer-mid { animation: layerFloat 2.2s ease-in-out infinite 0.3s; }
    .layer-bot { animation: layerFloat 2.2s ease-in-out infinite 0.6s; }
    @keyframes layerFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }
  </style>
  <polygon class="layer-top" points="12 2 2 7 12 12 22 7 12 2" stroke="#2563EB" />
  <polyline class="layer-mid" points="2 17 12 22 22 17" stroke="#4E70F6" />
  <polyline class="layer-bot" points="2 12 12 17 22 12" stroke="#4E70F6" />
</svg>
