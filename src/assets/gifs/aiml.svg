<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .ai-chip { animation: chipGlow 2.5s infinite ease-in-out; }
    .ai-core { animation: corePulse 1.8s infinite ease-in-out; }
    @keyframes chipGlow {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }
    @keyframes corePulse {
      0%, 100% { transform: scale(1); transform-origin: 12px 12px; }
      50% { transform: scale(1.15); transform-origin: 12px 12px; }
    }
  </style>
  <!-- Outer Chip Boundary -->
  <rect class="ai-chip" x="4" y="4" width="16" height="16" rx="3" stroke="#2563EB" stroke-width="2" />
  <!-- Center Core -->
  <rect class="ai-core" x="9" y="9" width="6" height="6" rx="1" fill="#7C3AED" stroke="#7C3AED" />
  <!-- Pins / Circuit Connections -->
  <line x1="9" y1="1" x2="9" y2="4" stroke="#4E70F6" />
  <line x1="15" y1="1" x2="15" y2="4" stroke="#4E70F6" />
  <line x1="9" y1="20" x2="9" y2="23" stroke="#4E70F6" />
  <line x1="15" y1="20" x2="15" y2="23" stroke="#4E70F6" />
  <line x1="20" y1="9" x2="23" y2="9" stroke="#4E70F6" />
  <line x1="20" y1="15" x2="23" y2="15" stroke="#4E70F6" />
  <line x1="1" y1="9" x2="4" y2="9" stroke="#4E70F6" />
  <line x1="1" y1="15" x2="4" y2="15" stroke="#4E70F6" />
</svg>
