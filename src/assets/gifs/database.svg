<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .glow { animation: databaseGlow 2.5s infinite ease-in-out; }
    .line-scan { animation: lineScan 2.5s infinite linear; }
    @keyframes databaseGlow {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes lineScan {
      0% { transform: translateY(0); }
      50% { transform: translateY(7px); }
      100% { transform: translateY(0); }
    }
  </style>
  <ellipse cx="12" cy="5" rx="9" ry="3" stroke="#88A5B7" fill="rgba(136, 165, 183, 0.1)" class="glow" />
  <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" stroke="#88A5B7" />
  <path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3" stroke="#88A5B7" class="line-scan" />
  <ellipse cx="12" cy="12" rx="9" ry="3" stroke="#0A192F" style="opacity: 0.8;" />
</svg>
